{% extends 'core/base.html' %}

{% block content %}
<div class="form-card">
    <h2>{{ titulo_pagina }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'listar_projetos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
